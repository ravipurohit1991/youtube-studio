name: Build

# Every push builds the Windows installer, the macOS disk images, the iOS app and the Android APKs and
# attaches them to the run
# (Actions tab > run > Artifacts). Pushing a tag like v1.0.1 also publishes a GitHub Release, and so
# does running the workflow by hand (Actions > Build > Run workflow) with a release tag filled in:
# the tag is then created on the commit that was built.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this new tag (for example v1.1.0). Leave empty to only build.'
        required: false
        default: 

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: YTD-Studio-Windows
          path: release/*.exe
          if-no-files-found: error

  mac:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One disk image per CPU: Apple Silicon (arm64) and Intel (x64). Ad-hoc signed, not notarized.
      - name: Build disk images
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm build
          pnpm exec electron-builder --mac dmg --publish never

      - name: Check the app bundle
        run: |
          app="$(find release -maxdepth 2 -name '*.app' -path '*arm64*' | head -1)"
          echo "Checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleShortVersionString|CFBundleIdentifier'
          ls -la release/*.dmg

      # The app downloads ffmpeg on first run; report (without failing the build) if a source moved.
      - name: Check ffmpeg download sources
        continue-on-error: true
        run: |
          for url in \
            https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip \
            https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffprobe.zip \
            https://evermeet.cx/ffmpeg/getrelease/zip \
            https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip; do
            echo "== $url"
            curl -sSL --max-time 120 -o /tmp/probe.zip -w '%{http_code} %{size_download} bytes %{url_effective}\n' "$url"
            unzip -l /tmp/probe.zip | tail -5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: YTD-Studio-macOS
          path: release/*.dmg
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-15
    env:
      YTD_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Built without a signing identity: sideloading tools (AltStore, Sideloadly, ...) sign the IPA with
      # the installing person's own Apple ID. See the README.
      - name: Build
        working-directory: ios
        run: |
          version="$(node -p "require('../package.json').version")"
          set -o pipefail
          xcodebuild \
            -project YTDStudio.xcodeproj \
            -scheme YTDStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$YTD_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E '^(.*error:|.*warning: .*YTDStudio/|\*\* BUILD)' || (tail -80 xcodebuild.log; exit 1)

      - name: Package IPA
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist ios/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/YTDStudio.app ios/Payload/
          (cd ios && zip -qry "../dist/YTD-Studio-$version-iOS-unsigned.ipa" Payload)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: YTD-Studio-iOS
          path: dist/*.ipa
          if-no-files-found: error

  desktop-e2e:
    name: Desktop end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Drives the real app with a stand-in yt-dlp and a fake media host (no YouTube access needed):
      # queue + live progress + stages, history removal, library grouping, streaming through the proxy.
      - name: Run end-to-end test
        run: xvfb-run -a -s "-screen 0 1440x900x24" pnpm test:e2e

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      YTD_BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      YTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      YTD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      YTD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: with these secrets set, every build is signed with your own key, so a new APK
      # installs over the previous one. Without them the APK is signed with a throwaway debug key.
      - name: Use release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YTD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for apk in android/app/build/outputs/apk/release/*.apk; do
            cp "$apk" dist/
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: YTD-Studio-Android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [windows, mac, ios, android, desktop-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Hand-written highlights for this version, if present, go above the generated change list.
      - name: Release notes
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: YTD Studio ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
