name: Build

# Every push builds the Windows installer and the Android APKs and attaches them to the run
# (Actions tab > run > Artifacts). Pushing a tag like v1.0.1 also publishes a GitHub Release, and so
# does running the workflow by hand (Actions > Build > Run workflow) with a release tag filled in:
# the tag is then created on the commit that was built.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this new tag (for example v1.1.0). Leave empty to only build.'
        required: false
        default: 

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: YTD-Studio-Windows
          path: release/*.exe
          if-no-files-found: error

  desktop-e2e:
    name: Desktop end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Drives the real app with a stand-in yt-dlp and a fake media host (no YouTube access needed):
      # queue + live progress + stages, history removal, library grouping, streaming through the proxy.
      - name: Run end-to-end test
        run: xvfb-run -a -s "-screen 0 1440x900x24" pnpm test:e2e

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      YTD_BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      YTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      YTD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      YTD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: with these secrets set, every build is signed with your own key, so a new APK
      # installs over the previous one. Without them the APK is signed with a throwaway debug key.
      - name: Use release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YTD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for apk in android/app/build/outputs/apk/release/*.apk; do
            cp "$apk" dist/
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: YTD-Studio-Android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [windows, android, desktop-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Hand-written highlights for this version, if present, go above the generated change list.
      - name: Release notes
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: YTD Studio ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
