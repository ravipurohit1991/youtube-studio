appId: com.ytdstudio.desktop
productName: YTD Studio
copyright: Copyright (c) 2026 YTD Studio
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-setup.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YTD Studio
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: "YTD-Studio-${version}-mac-${arch}.${ext}"
  # Ad-hoc signature: Apple Silicon will not start unsigned code. Not notarized (needs a paid Apple
  # developer account), so the first launch goes through right-click > Open (see the README).
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: "${productName} ${version}"
  writeUpdateInfo: false
